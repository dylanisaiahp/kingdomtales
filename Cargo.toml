[package]
name = "KingdomTales"
version = "0.0.2"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "ui_picking"] }
noise = "0.9"

# Keep debug builds playable: our code stays fast to compile, dependencies are optimized.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
